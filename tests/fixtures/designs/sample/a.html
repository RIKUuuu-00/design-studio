<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案A 一覧重視</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font: var(--text-md)/var(--leading-normal) var(--font-sans); }
  .page { max-width: var(--container-max); margin: 0 auto; padding: var(--space-5) var(--gutter); }
  h1 { font-size: var(--text-xl); margin: 0 0 var(--space-4); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); }
  .card-title { margin: 0; font-size: var(--text-sm); color: var(--color-text-muted); }
  .card-value { margin: var(--space-2) 0 0; font-size: var(--text-2xl); font-weight: var(--weight-bold); }
</style>
</head>
<body>
<main class="page">
  <h1>営業ダッシュボード</h1>
  <div class="grid">
    <section class="card"><h2 class="card-title">今月の商談数</h2><p class="card-value">128件</p></section>
    <section class="card"><h2 class="card-title">商談化率</h2><p class="card-value">18.4%</p></section>
    <section class="card"><h2 class="card-title">日報提出率</h2><p class="card-value">62%</p></section>
  </div>
</main>
</body>
</html>
